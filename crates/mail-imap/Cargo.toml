[package]
name = "mail-imap"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Compiles the in-memory fake server (src/fake.rs) for other crates' tests.
# Only ever enabled from [dev-dependencies] (SPEC_GAPS G14).
fake = []

[dependencies]
async-imap.workspace = true
rustls.workspace = true
rustls-platform-verifier.workspace = true
sha2.workspace = true
socket2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time", "net", "io-util", "rt"] }
tokio-rustls.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["sync", "time", "net", "io-util", "rt", "macros", "test-util"] }
