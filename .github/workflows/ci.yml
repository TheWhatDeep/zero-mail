# BUILD.md section 15/16: every automated test green. Until M11 the app is built and tested on
# Windows only; the Stalwart container and the platform-neutral checks run on Linux (SPEC_GAPS G24).
# Actions are pinned to full commit SHAs of releases at least two weeks old.
name: CI

on:
  push:
    branches: [main]
    tags: ["m*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "24"

jobs:
  checks:
    name: Boundaries, freshness, format, audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable, 2026-10-01
        with:
          toolchain: stable
          components: rustfmt
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-audit
      - run: node scripts/check-deps.mjs --online
      - run: cargo fmt --all -- --check
      - run: cargo audit
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm ci
        working-directory: ui
      - run: npm audit --audit-level=low
        working-directory: ui

  test:
    name: Test (windows-2025)
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable, 2026-10-01
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: npm ci
      - run: npm ci
        working-directory: ui
      - name: Frontend lint
        run: npm run lint
        working-directory: ui
      - name: Frontend tests
        run: npm test
        working-directory: ui
      # tauri::generate_context! embeds ui/dist, so the frontend is built before Rust compiles.
      - name: Frontend build
        run: npm run build
        working-directory: ui
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Failing tests are also published as annotations, which can be read without
      # signing in to the logs.
      - name: Backend tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee test.log || {
            grep -E "^test .* FAILED$|panicked at|^thread '.*' .*panicked" -A3 test.log | head -40 | sed 's/^/::error title=cargo test::/'
            exit 1
          }

  integration:
    name: Stalwart integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable, 2026-10-01
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Built before the container starts, so its start-up overlaps nothing slow.
      - name: Build container-backed tests
        run: cargo test -p mail-core -p mail-sync --test stalwart --no-run
      - name: Start Stalwart
        run: docker compose -f tests/docker/compose.yml up -d --wait
      - name: Smoke check
        run: node tests/docker/smoke.mjs
      # Tests that need the container are #[ignore]d everywhere else (SPEC_GAPS G24).
      - name: Container-backed tests
        run: |
          cargo test -p mail-core --test stalwart -- --ignored --test-threads=1
          cargo test -p mail-sync --test stalwart -- --ignored --test-threads=1 --nocapture
      - name: Stalwart logs
        if: failure()
        run: docker compose -f tests/docker/compose.yml logs
      - name: Stop Stalwart
        if: always()
        run: docker compose -f tests/docker/compose.yml down -v

  perf:
    name: Startup harness (windows-2025)
    needs: test
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable, 2026-10-01
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: npm ci
      - run: npm ci
        working-directory: ui
      - name: Release build
        run: npx tauri build --no-bundle
      - name: Generate the 50,000-message fixture
        run: cargo run --release -p mail-store --example fixture -- tests/fixtures/generated/perf 50000
      # Startup is enforced (SPEC_GAPS G44); scrolling is measured and its DOM rows enforced.
      # 60 fps is checked on the owner's machine (G41): a hosted runner's frame rate says
      # little about a real display.
      - name: Measure startup and scrolling
        run: node tests/perf/startup.mjs --data tests/fixtures/generated/perf --runs 5 --scroll --enforce
      # T19, webview half (SPEC_GAPS G56): every XSS corpus message opened in the release app
      # with zero outbound requests.
      - name: Generate the XSS fixture
        run: cargo run --release -p mail-store --example xss_fixture -- tests/fixtures/generated/xss tests/fixtures/xss/corpus.html
      - name: T19 harness (WebView2)
        run: node tests/render/xss-harness.mjs --data tests/fixtures/generated/xss
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: startup-windows-2025
          path: |
            tests/perf/results/startup.json
            tests/render/results/xss.json
